<style>
/* こころ香 — 温かみのある和のデザイン */

:root {
  --bg: #f8f2e7;
  --paper: #fffdf8;
  --paper-soft: #fbf6ec;
  --ink: #4a3f35;
  --ink-soft: #7a6f63;
  --accent: #c8795a;        /* テラコッタ */
  --accent-deep: #b06548;
  --green: #7d9b76;         /* 抹茶 */
  --green-soft: #e8efe4;
  --gold: #c9a86a;
  --line: #e8ddcc;
  --radius: 20px;
  --shadow: 0 6px 24px rgba(122, 96, 70, 0.12);
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-head: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font-body);
  background:
    radial-gradient(circle at 15% 20%, rgba(201, 168, 106, 0.08), transparent 40%),
    radial-gradient(circle at 85% 75%, rgba(125, 155, 118, 0.08), transparent 45%),
    var(--bg);
  color: var(--ink);
  line-height: 1.8;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

#app { flex: 1; width: 100%; }

/* ---- 背景の飾り(葉っぱ) ---- */
.bg-deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.leaf {
  position: absolute;
  width: 130px; height: 130px;
  background: var(--green);
  opacity: 0.07;
  border-radius: 0 65% 0 65%;
  transform: rotate(20deg);
}
.leaf-1 { top: -30px; left: -40px; }
.leaf-2 { bottom: 12%; right: -50px; width: 170px; height: 170px; transform: rotate(200deg); }
.leaf-3 { top: 40%; left: -60px; width: 100px; height: 100px; transform: rotate(120deg); background: var(--accent); }

/* ---- 画面切り替え ---- */
.screen { display: none; position: relative; z-index: 1; padding: 24px 16px 48px; }
.screen.is-active { display: block; }

.fade-in { animation: fadeUp 0.45s ease both; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---- ボタン共通 ---- */
.btn {
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 700;
  border: none;
  border-radius: 999px;
  padding: 14px 36px;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}
.btn:active { transform: scale(0.97); }

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-deep));
  color: #fff;
  box-shadow: 0 6px 18px rgba(200, 121, 90, 0.35);
}
.btn-primary:hover { box-shadow: 0 8px 22px rgba(200, 121, 90, 0.45); transform: translateY(-1px); }

.btn-sub {
  background: var(--green-soft);
  color: var(--green);
  border: 1.5px solid var(--green);
}
.btn-sub:hover { background: #dfe9da; }
.btn-sub:disabled { opacity: 0.7; cursor: default; }

.btn-ghost {
  background: transparent;
  color: var(--ink-soft);
  padding: 10px 20px;
}
.btn-ghost:hover:not(:disabled) { color: var(--accent); }
.btn-ghost:disabled { opacity: 0.35; cursor: default; }

/* ================= ホーム ================= */
.home-inner { max-width: 640px; margin: 0 auto; text-align: center; padding-top: 40px; }

.home-eyebrow {
  color: var(--accent);
  font-size: 0.95rem;
  letter-spacing: 0.2em;
  margin-bottom: 8px;
}

.home-title {
  font-family: var(--font-head);
  font-size: 3.2rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--ink);
}
.title-accent { color: var(--accent); }

.home-sub {
  color: var(--ink-soft);
  letter-spacing: 0.25em;
  font-size: 0.9rem;
  margin-top: 4px;
  margin-bottom: 32px;
}

.home-card {
  background: var(--paper);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 36px 28px;
  border: 1px solid var(--line);
}

.home-lead { font-size: 1rem; margin-bottom: 24px; }
.home-lead strong { color: var(--accent-deep); }

.home-points {
  list-style: none;
  text-align: left;
  max-width: 420px;
  margin: 0 auto 28px;
  background: var(--paper-soft);
  border-radius: 14px;
  padding: 16px 22px;
}
.home-points li {
  padding: 6px 0;
  font-size: 0.95rem;
}
.point-icon { margin-right: 10px; }

.home-note {
  margin-top: 18px;
  font-size: 0.78rem;
  color: var(--ink-soft);
}

.pc-only { display: none; }
@media (min-width: 600px) { .pc-only { display: inline; } }

/* ================= 診断 ================= */
.quiz-inner { max-width: 640px; margin: 0 auto; padding-top: 16px; }

.quiz-header { margin-bottom: 20px; }

.progress-label {
  display: flex;
  justify-content: center;
  font-size: 0.88rem;
  color: var(--ink-soft);
  margin-bottom: 8px;
  letter-spacing: 0.1em;
}

.progress-track {
  height: 8px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--gold), var(--accent));
  border-radius: 999px;
  transition: width 0.35s ease;
}

.question-card {
  background: var(--paper);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  padding: 30px 26px;
}

.question-no {
  font-family: var(--font-head);
  color: var(--accent);
  font-size: 1.05rem;
  letter-spacing: 0.15em;
  margin-bottom: 6px;
}

.question-text {
  font-size: 1.18rem;
  font-weight: 700;
  margin-bottom: 22px;
}

.options { display: grid; gap: 12px; }

.option-btn {
  font-family: var(--font-body);
  text-align: left;
  font-size: 0.98rem;
  line-height: 1.6;
  background: var(--paper-soft);
  color: var(--ink);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 14px 18px;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
}
.option-btn:hover {
  border-color: var(--accent);
  background: #fdf3ec;
}
.option-btn:active { transform: scale(0.99); }
.option-btn.is-selected {
  border-color: var(--accent);
  background: #fbeade;
  box-shadow: 0 0 0 2px rgba(200, 121, 90, 0.18);
}

.quiz-footer {
  display: flex;
  justify-content: flex-start;
  margin-top: 16px;
}

/* ================= 結果 ================= */
.result-inner { max-width: 680px; margin: 0 auto; padding-top: 8px; }

.result-eyebrow {
  text-align: center;
  color: var(--accent);
  letter-spacing: 0.25em;
  font-size: 0.9rem;
  margin-bottom: 14px;
}

.result-card {
  background: var(--paper);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  padding: 28px 26px;
  margin-bottom: 22px;
}

.type-card {
  text-align: center;
  background:
    radial-gradient(circle at 80% 10%, rgba(201, 168, 106, 0.12), transparent 50%),
    var(--paper);
}
.type-heading { color: var(--ink-soft); font-size: 0.95rem; }
.type-name {
  font-family: var(--font-head);
  font-size: 2rem;
  color: var(--accent-deep);
  letter-spacing: 0.08em;
  margin: 4px 0 8px;
}
.type-catch {
  font-weight: 700;
  color: var(--green);
  margin-bottom: 16px;
}
.type-desc { text-align: left; font-size: 0.95rem; }

.result-section-title {
  font-family: var(--font-head);
  font-size: 1.25rem;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
  color: var(--ink);
}
.title-deco { margin-right: 8px; }

.result-section-lead {
  font-size: 0.9rem;
  color: var(--ink-soft);
  margin-bottom: 16px;
}

/* こころとからだのサイン */
.need-list { list-style: none; display: grid; gap: 12px; }
.need-item {
  background: var(--green-soft);
  border-radius: 14px;
  padding: 14px 18px;
}
.need-label {
  display: block;
  font-weight: 700;
  color: var(--green);
  margin-bottom: 2px;
}
.need-text { font-size: 0.88rem; color: var(--ink-soft); }

/* ブレンドレシピ */
.blend-card {
  background:
    radial-gradient(circle at 10% 90%, rgba(125, 155, 118, 0.1), transparent 45%),
    var(--paper);
}
.blend-list { list-style: none; display: grid; gap: 10px; margin-bottom: 20px; }

.blend-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 16px;
}

.blend-oil { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

.oil-chip {
  font-size: 0.7rem;
  font-weight: 700;
  border-radius: 999px;
  padding: 2px 10px;
  color: #fff;
  white-space: nowrap;
}
.oil-chip--citrus { background: #e0a23c; }
.oil-chip--floral { background: #d98ba3; }
.oil-chip--herb   { background: #8aab5c; }
.oil-chip--woody  { background: #7e9b8a; }
.oil-chip--resin  { background: #b08960; }
.oil-chip--spice  { background: #c4684a; }

.oil-name { font-weight: 700; font-size: 1.02rem; }
.oil-en { font-size: 0.75rem; color: var(--ink-soft); letter-spacing: 0.05em; }

.blend-drops { display: flex; align-items: center; gap: 8px; }

.drop {
  width: 16px; height: 16px;
  fill: var(--accent);
  opacity: 0.85;
  margin-right: 1px;
  vertical-align: middle;
}
.drops-num {
  font-weight: 700;
  color: var(--accent-deep);
  white-space: nowrap;
}

/* 精油の説明 */
.oil-desc-list { list-style: none; display: grid; gap: 14px; }
.oil-desc-name { font-size: 1rem; color: var(--accent-deep); margin-bottom: 2px; }
.oil-desc-text { font-size: 0.9rem; }

/* 楽しみ方 */
.usage-list { list-style: none; display: grid; gap: 12px; font-size: 0.92rem; }
.usage-list li {
  padding-left: 16px;
  border-left: 3px solid var(--gold);
}
.usage-list strong { color: var(--ink); }

/* 注意 */
.caution-card { background: #fdf6ee; }
.caution-list {
  list-style: none;
  font-size: 0.85rem;
  color: var(--ink-soft);
  display: grid;
  gap: 6px;
  margin-bottom: 12px;
}
.caution-list li { padding-left: 18px; position: relative; }
.caution-list li::before {
  content: "・";
  position: absolute;
  left: 0;
  color: var(--accent);
}
.caution-list--common { margin-bottom: 0; }

.result-actions { text-align: center; margin: 30px 0 10px; }

/* ---- フッター ---- */
.site-footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 20px 16px 28px;
  color: var(--ink-soft);
  font-size: 0.8rem;
  letter-spacing: 0.08em;
}

/* ---- レスポンシブ微調整 ---- */
@media (max-width: 480px) {
  .home-title { font-size: 2.5rem; }
  .home-card { padding: 28px 20px; }
  .question-card { padding: 24px 18px; }
  .result-card { padding: 24px 18px; }
  .type-name { font-size: 1.6rem; }
}

</style>
</head>

<script>
/* 診断ロジック
 * 30問の回答(各質問の選択肢index)から、
 *  1. 性格タイプの判定
 *  2. こころとからだのニーズの集計
 *  3. 精油2〜6種類のブレンドと滴数の算出
 * を行う。
 */
(function (global) {
  const NEED_LABELS = {
    relax:    { label: "緊張をほどいてリラックス", text: "気づかぬうちに、肩や心に力が入っている時間が長いようです。" },
    sleep:    { label: "心地よい眠りをサポート", text: "眠りの質が、いまのあなたのいちばんの充電ポイントです。" },
    uplift:   { label: "気分を明るく前向きに", text: "心がすこし曇りがち。香りの力で、窓を開けて光を入れましょう。" },
    energize: { label: "元気と活力をチャージ", text: "おつかれが溜まっています。まずはエネルギーの補給から。" },
    focus:    { label: "頭をクリアにして集中", text: "頭のもやを晴らして、すっきり集中できる状態に整えましょう。" },
    balance:  { label: "こころとからだのバランスを整える", text: "気分や体調に波が出やすい時期。ゆらぎに寄り添う香りを。" },
    comfort:  { label: "不安をやわらげて安心感を", text: "小さな心配ごとを抱えがち。安心に包まれる時間が必要です。" },
    warmth:   { label: "からだを温めて巡りをよく", text: "冷えやこわばりのサインが見えています。じんわり温めましょう。" },
    clear:    { label: "深い呼吸でリフレッシュ", text: "呼吸が浅くなりがち。香りで深いひと呼吸を取り戻しましょう。" }
  };

  const FAMILY_LABELS = {
    citrus: "柑橘系",
    floral: "フローラル系",
    herb: "ハーブ系",
    woody: "樹木系",
    resin: "樹脂・オリエンタル系",
    spice: "スパイス系"
  };

  // ブレンドの本数ごとの合計滴数(2種=4滴 〜 6種=9滴)
  const TOTAL_DROPS = { 2: 4, 3: 5, 4: 6, 5: 8, 6: 9 };

  function addWeights(acc, weights) {
    if (!weights) return;
    for (const key of Object.keys(weights)) {
      acc[key] = (acc[key] || 0) + weights[key];
    }
  }

  function topKey(obj, order) {
    let best = null;
    let bestVal = -Infinity;
    for (const key of order) {
      const v = obj[key] || 0;
      if (v > bestVal) { best = key; bestVal = v; }
    }
    return best;
  }

  function diagnose(answers, data) {
    const { questions, oils, types } = data;
    if (!Array.isArray(answers) || answers.length !== questions.length) {
      throw new Error("回答数が不正です");
    }

    // --- 集計 ---
    const traits = {};
    const needs = {};
    const fams = {};
    questions.forEach((question, i) => {
      const opt = question.opts[answers[i]];
      if (!opt) throw new Error("選択肢が不正です: Q" + (i + 1));
      addWeights(traits, opt.t);
      addWeights(needs, opt.n);
      addWeights(fams, opt.s);
    });

    // --- 性格タイプ判定(同点時はこの並び順で先のものを採用) ---
    const typeOrder = ["sun", "moon", "forest", "wind", "earth", "izumi", "fire", "snow"];
    const typeId = topKey(traits, typeOrder);
    const type = types[typeId];

    // タイプと相性のよい香り系統をボーナス加点
    addWeights(fams, type.families);

    // --- ニーズの整理 ---
    // ニーズがまったく無い回答パターンでも破綻しないよう、最低限のデフォルトを置く
    if (Object.keys(needs).length === 0) {
      needs.relax = 1;
      needs.uplift = 1;
    }
    const needKeys = Object.keys(NEED_LABELS).filter((k) => (needs[k] || 0) > 0);
    needKeys.sort((a, b) => (needs[b] - needs[a]) || a.localeCompare(b));
    const maxNeed = Math.max(needs[needKeys[0]] || 0, 1);
    const strongNeeds = needKeys.filter((k) => needs[k] >= maxNeed * 0.5);

    // --- ブレンド本数: 強いニーズの数に応じて2〜6種類 ---
    const size = Math.min(6, Math.max(2, 1 + strongNeeds.length));

    // --- 各精油のスコアリング ---
    const maxFam = Math.max(...Object.values(fams), 1);
    const scored = oils.map((oil) => {
      let score = 0;
      for (const k of Object.keys(oil.needs)) {
        score += (needs[k] || 0) / maxNeed * oil.needs[k];
      }
      score += 1.5 * ((fams[oil.family] || 0) / maxFam);
      return { oil, score };
    });
    scored.sort((a, b) => (b.score - a.score) || a.oil.id.localeCompare(b.oil.id));

    // --- 精油の選定(同系統に偏りすぎない・香りのノートのバランスを取る) ---
    const maxPerFamily = Math.max(2, Math.ceil(size / 2));
    const picked = [];
    const famCount = {};
    for (const entry of scored) {
      if (picked.length >= size) break;
      const fam = entry.oil.family;
      if ((famCount[fam] || 0) >= maxPerFamily) continue;
      picked.push(entry);
      famCount[fam] = (famCount[fam] || 0) + 1;
    }
    // 万一埋まらなければ系統制限を外して補充
    if (picked.length < size) {
      for (const entry of scored) {
        if (picked.length >= size) break;
        if (!picked.includes(entry)) picked.push(entry);
      }
    }

    // 3種以上のブレンドでは、軽い香り(トップ)と残る香り(ミドル/ベース)を両方含める
    if (size >= 3) {
      ensureNote(picked, scored, (n) => n === "top");
      ensureNote(picked, scored, (n) => n !== "top");
    }

    // --- 滴数の配分 ---
    // 香りの強い精油は少なめになるよう、スコアを香り強度で割って重みとする
    const total = TOTAL_DROPS[picked.length] || 5;
    const weights = picked.map((e) => Math.max(e.score, 0.1) / (0.5 + 0.5 * e.oil.strength));
    const drops = allocateDrops(weights, total);

    const blend = picked
      .map((e, i) => ({ oil: e.oil, drops: drops[i] }))
      .sort((a, b) => (b.drops - a.drops) || a.oil.id.localeCompare(b.oil.id));

    // --- 注意事項の収集 ---
    const cautions = [];
    for (const item of blend) {
      for (const c of item.oil.cautions) {
        const text = item.oil.name + ": " + c;
        if (!cautions.includes(text)) cautions.push(text);
      }
    }

    return {
      typeId,
      type,
      topNeeds: needKeys.slice(0, 3).map((k) => ({ key: k, ...NEED_LABELS[k], score: needs[k] })),
      blend,
      totalDrops: blend.reduce((sum, b) => sum + b.drops, 0),
      cautions
    };
  }

  // picked の中に条件を満たすノートの精油が無ければ、
  // スコア上位の未選定精油と最下位の選定済み精油を入れ替える
  function ensureNote(picked, scored, noteTest) {
    if (picked.some((e) => noteTest(e.oil.note))) return;
    const candidate = scored.find((e) => !picked.includes(e) && noteTest(e.oil.note));
    if (!candidate) return;
    // 入れ替えても条件が崩れないよう、同条件でない精油の中で最下位を外す
    for (let i = picked.length - 1; i >= 0; i--) {
      if (!noteTest(picked[i].oil.note)) {
        picked[i] = candidate;
        return;
      }
    }
  }

  // 重みに比例して合計 total 滴を配分(各精油 最低1滴、最大化剰余方式)
  function allocateDrops(weights, total) {
    const n = weights.length;
    const sum = weights.reduce((a, b) => a + b, 0) || 1;
    const raw = weights.map((w) => (w / sum) * total);
    const drops = raw.map((r) => Math.max(1, Math.floor(r)));
    let used = drops.reduce((a, b) => a + b, 0);

    // 余りの大きい順に1滴ずつ追加
    const order = raw
      .map((r, i) => ({ i, frac: r - Math.floor(r) }))
      .sort((a, b) => b.frac - a.frac);
    let oi = 0;
    while (used < total) {
      drops[order[oi % n].i] += 1;
      used += 1;
      oi += 1;
    }
    // 切り上げで超過した場合は、多い精油から1滴ずつ減らす(最低1滴は保つ)
    while (used > total) {
      let maxI = 0;
      for (let i = 1; i < n; i++) if (drops[i] > drops[maxI]) maxI = i;
      if (drops[maxI] <= 1) break;
      drops[maxI] -= 1;
      used -= 1;
    }
    return drops;
  }

  const api = { diagnose, NEED_LABELS, FAMILY_LABELS, TOTAL_DROPS };
  global.AROMA = global.AROMA || {};
  Object.assign(global.AROMA, api);
  if (typeof module !== "undefined" && module.exports) module.exports = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* 画面制御 */
(function () {
  const A = window.AROMA;
  const questions = A.questions;

  const screens = {
    home: document.getElementById("screen-home"),
    quiz: document.getElementById("screen-quiz"),
    result: document.getElementById("screen-result")
  };

  const els = {
    start: document.getElementById("btn-start"),
    back: document.getElementById("btn-back"),
    progressText: document.getElementById("progress-text"),
    progressFill: document.getElementById("progress-fill"),
    progressWrap: document.getElementById("progress-bar-wrap"),
    questionCard: document.getElementById("question-card"),
    questionNo: document.getElementById("question-no"),
    questionText: document.getElementById("question-text"),
    options: document.getElementById("options"),
    resultInner: document.getElementById("result-inner")
  };

  let current = 0;
  let answers = [];

  function showScreen(name) {
    for (const key of Object.keys(screens)) {
      screens[key].classList.toggle("is-active", key === name);
    }
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }

  function startQuiz() {
    current = 0;
    answers = [];
    showScreen("quiz");
    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[current];
    els.progressText.textContent = `質問 ${current + 1} / ${questions.length}`;
    els.progressFill.style.width = `${(current / questions.length) * 100}%`;
    els.progressWrap.setAttribute("aria-valuenow", String(current));
    els.questionNo.textContent = `Q${current + 1}`;
    els.questionText.textContent = q.q;
    els.back.disabled = current === 0;

    els.options.innerHTML = "";
    q.opts.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option-btn";
      if (answers[current] === idx) btn.classList.add("is-selected");
      btn.textContent = opt.label;
      btn.addEventListener("click", () => selectOption(idx, btn));
      els.options.appendChild(btn);
    });

    // ふわっと出すアニメーション
    els.questionCard.classList.remove("fade-in");
    void els.questionCard.offsetWidth;
    els.questionCard.classList.add("fade-in");
  }

  function selectOption(idx, btn) {
    answers[current] = idx;
    [...els.options.children].forEach((b) => b.classList.remove("is-selected"));
    btn.classList.add("is-selected");

    // 選択の余韻を少し見せてから次へ
    setTimeout(() => {
      if (current < questions.length - 1) {
        current += 1;
        renderQuestion();
      } else {
        showResult();
      }
    }, 260);
  }

  function goBack() {
    if (current > 0) {
      current -= 1;
      renderQuestion();
    }
  }

  function showResult() {
    const result = A.diagnose(answers, {
      questions: A.questions,
      oils: A.oils,
      types: A.types
    });
    els.resultInner.innerHTML = buildResultHTML(result);
    showScreen("result");

    document.getElementById("btn-restart").addEventListener("click", () => {
      showScreen("home");
    });
    const copyBtn = document.getElementById("btn-copy");
    copyBtn.addEventListener("click", () => copyRecipe(result, copyBtn));
  }

  function dropIcons(count) {
    const drop =
      '<svg class="drop" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C12 2.5 5.5 10.5 5.5 15a6.5 6.5 0 0 0 13 0C18.5 10.5 12 2.5 12 2.5Z"/></svg>';
    return drop.repeat(count);
  }

  function escapeHTML(s) {
    return s.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function buildResultHTML(result) {
    const t = result.type;

    const needsHTML = result.topNeeds
      .map(
        (n) => `
        <li class="need-item">
          <span class="need-label">${escapeHTML(n.label)}</span>
          <span class="need-text">${escapeHTML(n.text)}</span>
        </li>`
      )
      .join("");

    const blendHTML = result.blend
      .map(
        (b) => `
        <li class="blend-row">
          <div class="blend-oil">
            <span class="oil-chip oil-chip--${b.oil.family}">${escapeHTML(A.FAMILY_LABELS[b.oil.family])}</span>
            <span class="oil-name">${escapeHTML(b.oil.name)}</span>
            <span class="oil-en">${escapeHTML(b.oil.en)}</span>
          </div>
          <div class="blend-drops">
            <span class="drops-icons">${dropIcons(b.drops)}</span>
            <span class="drops-num">${b.drops}滴</span>
          </div>
        </li>`
      )
      .join("");

    const oilDescHTML = result.blend
      .map(
        (b) => `
        <li class="oil-desc-item">
          <h4 class="oil-desc-name">${escapeHTML(b.oil.name)} <span class="oil-en">${escapeHTML(b.oil.en)}</span></h4>
          <p class="oil-desc-text">${escapeHTML(b.oil.desc)}</p>
        </li>`
      )
      .join("");

    const cautionsHTML =
      result.cautions.length > 0
        ? `<ul class="caution-list">${result.cautions
            .map((c) => `<li>${escapeHTML(c)}</li>`)
            .join("")}</ul>`
        : "";

    return `
      <p class="result-eyebrow">あなたの診断結果</p>
      <section class="result-card type-card fade-in">
        <p class="type-heading">あなたは</p>
        <h2 class="type-name">${escapeHTML(t.name)}</h2>
        <p class="type-catch">${escapeHTML(t.catch)}</p>
        <p class="type-desc">${escapeHTML(t.desc)}</p>
      </section>

      <section class="result-card fade-in">
        <h3 class="result-section-title"><span class="title-deco">🌱</span>こころとからだのサイン</h3>
        <p class="result-section-lead">回答の中から、いまのあなたにそっと必要そうなものを読み取りました。</p>
        <ul class="need-list">${needsHTML}</ul>
      </section>

      <section class="result-card blend-card fade-in">
        <h3 class="result-section-title"><span class="title-deco">💧</span>あなたのためのブレンドレシピ</h3>
        <p class="result-section-lead">${escapeHTML(t.name)}のあなたへ。${result.blend.length}種類・合計${result.totalDrops}滴のブレンドです。</p>
        <ul class="blend-list">${blendHTML}</ul>
        <button id="btn-copy" class="btn btn-sub">レシピをコピーする</button>
      </section>

      <section class="result-card fade-in">
        <h3 class="result-section-title"><span class="title-deco">🌿</span>ブレンドに使う精油たち</h3>
        <ul class="oil-desc-list">${oilDescHTML}</ul>
      </section>

      <section class="result-card fade-in">
        <h3 class="result-section-title"><span class="title-deco">🫖</span>楽しみ方</h3>
        <ul class="usage-list">
          <li><strong>芳香浴(ディフューザー)</strong> — レシピの滴数をそのまま入れて、お部屋に香りを広げて。</li>
          <li><strong>ハンカチ・マグカップ</strong> — 合計1〜2滴に減らして垂らせば、外出先やデスクでも手軽に。</li>
          <li><strong>アロマバス</strong> — 合計3〜5滴を無水エタノールやバスオイルなどの基材に混ぜてから湯船へ。精油を直接お湯に入れるのは避けましょう。</li>
        </ul>
      </section>

      <section class="result-card caution-card fade-in">
        <h3 class="result-section-title"><span class="title-deco">⚠️</span>安全に楽しむために</h3>
        ${cautionsHTML}
        <ul class="caution-list caution-list--common">
          <li>精油の原液を直接肌につけない・飲用しないでください。</li>
          <li>妊娠中・授乳中の方、持病のある方、お子さまやペットのいるご家庭では、使用前に専門家へご相談ください。</li>
          <li>体調や肌に異変を感じたら、すぐに使用を中止してください。</li>
          <li>この診断は医療行為ではなく、香りを楽しむための提案です。</li>
        </ul>
      </section>

      <div class="result-actions">
        <button id="btn-restart" class="btn btn-primary">もう一度診断する</button>
      </div>
    `;
  }

  function copyRecipe(result, btn) {
    const lines = [
      "【こころ香 アロマブレンドレシピ】",
      `タイプ: ${result.type.name}`,
      ...result.blend.map((b) => `・${b.oil.name} (${b.oil.en}) … ${b.drops}滴`),
      `合計 ${result.totalDrops}滴`
    ];
    const text = lines.join("\n");

    const done = () => {
      const original = btn.textContent;
      btn.textContent = "コピーしました ✓";
      btn.disabled = true;
      setTimeout(() => {
        btn.textContent = original;
        btn.disabled = false;
      }, 1800);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      done();
    } catch (e) {
      window.prompt("以下のレシピをコピーしてください", text);
    }
    document.body.removeChild(ta);
  }

  els.start.addEventListener("click", startQuiz);
  els.back.addEventListener("click", goBack);
})();

</script>
